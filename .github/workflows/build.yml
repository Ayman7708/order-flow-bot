name: Build Order Flow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Create Android scaffolding
        run: |
          flutter create --project-name order_flow_bot --org com.cryptobot --platforms android /tmp/scaffold
          cp -r /tmp/scaffold/android .
          cp /tmp/scaffold/.metadata . || true

      - name: Patch AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          cp "$MANIFEST" /tmp/manifest_before.txt
          
          # 1. Add permissions before <application
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.WAKE_LOCK"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><application|' "$MANIFEST"
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><application|' "$MANIFEST"

          # 2. Add background service inside <application
          # Replace closing </application> with service + closing
          sed -i 's|</application>|<service android:name="id.flutter.flutter_background_service.BackgroundService" android:foregroundServiceType="dataSync" android:exported="false" android:stopWithTask="false" /></application>|' "$MANIFEST"
          
          echo "===== Manifest changes ====="
          diff /tmp/manifest_before.txt "$MANIFEST" || true
          echo "===== Final manifest ====="
          cat "$MANIFEST"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cryptobot.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'KEYEOF'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=cryptobot.jks
          KEYEOF

      - name: Patch build.gradle
        run: |
          cat > android/app/build.gradle << 'GRADLE_EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found.")
          }
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
              namespace "com.cryptobot.order_flow_bot"
              compileSdkVersion 34
              ndkVersion flutter.ndkVersion
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
              sourceSets { main.java.srcDirs += 'src/main/kotlin' }
              defaultConfig {
                  applicationId "com.cryptobot.order_flow_bot"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
                  multiDexEnabled true
              }
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter { source '../..' }
          GRADLE_EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugin build.gradle files
        run: |
          PUB_CACHE=$(flutter pub cache dir 2>/dev/null || echo "$HOME/.pub-cache")
          COUNT=0
          for f in $PUB_CACHE/hosted/pub.dev/*/android/build.gradle; do
            if [ -f "$f" ] && grep -q "flutter.compileSdkVersion" "$f"; then
              sed -i 's/flutter\.compileSdkVersion/34/g' "$f"
              sed -i 's/flutter\.minSdkVersion/21/g' "$f"
              sed -i 's/flutter\.targetSdkVersion/34/g' "$f"
              COUNT=$((COUNT+1))
            fi
          done
          echo "Patched $COUNT plugin files"

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: order-flow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
